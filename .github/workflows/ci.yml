name: CI - EstudiantesNet

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore EstudiantesNet.sln

      - name: Compilar solución
        run: dotnet build EstudiantesNet.sln --configuration Release --no-restore

      - name: Ejecutar pruebas y cobertura
        run: >
          dotnet test EstudiantesNet.sln
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Instalar ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generar reporte HTML de cobertura
        run: >
          reportgenerator
          -reports:"./TestResults/**/coverage.cobertura.xml"
          -targetdir:"./CoverageReport"
          -reporttypes:"Html"

      - name: Publicar reporte de cobertura XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Publicar reporte HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: ./CoverageReport

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build \
            --file EstudiantesNet.Api/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/estudiantesnet-api:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository_owner }}/estudiantesnet-api:latest \
            .

      - name: Publicar imagen en GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/estudiantesnet-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/estudiantesnet-api:latest
